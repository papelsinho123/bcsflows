name: Deploy to Locaweb FTP
on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Prepare deploy package
        shell: bash
        run: |
          rm -rf deploy || true
          mkdir -p deploy
          cp -r dist/* deploy/ || true
          if [ -d api ]; then
            mkdir -p deploy/api
            cp -r api/* deploy/api/ || true
            rm -f deploy/api/db.php || true
          fi
          if [ -f .htaccess ]; then
            cp .htaccess deploy/.htaccess
          fi
          find deploy -maxdepth 2 -print | sort

      - name: Deploy via FTP with lftp
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" <<EOF
          set ftp:ssl-allow no
          set ssl:verify-certificate no
          set ftp:passive-mode true
          mkdir -p /public_html/bcsflows
          mkdir -p /public_html/bcsflows/api
          cd /public_html/bcsflows
          lcd "$GITHUB_WORKSPACE/deploy"
          mirror -R --delete --verbose ./ ./
          bye
          EOF
